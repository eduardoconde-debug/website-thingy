<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff; --ink:#111; --tile:#e6e6e6; --tile-edge:#bdbdbd; --card:#fff;
  --chk-a:#fff; --chk-b:#d9d9d9; --mint:#37f0ad; --yes:#14e014; --no:#ff1744;
  --font:"Chakra Petch","Orbitron","Arial Narrow",Impact,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101010; --ink:#f2f2f2; --tile:#2b2b2b; --tile-edge:#4a4a4a; --card:#1b1b1b;
    --chk-a:#1a1a1a; --chk-b:#262626;
  }
}
:root[data-theme="dark"]{
  --bg:#101010; --ink:#f2f2f2; --tile:#2b2b2b; --tile-edge:#4a4a4a; --card:#1b1b1b;
  --chk-a:#1a1a1a; --chk-b:#262626;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
body.is-home{
  background-color:var(--chk-a);
  background-image:conic-gradient(var(--chk-b) 25%,transparent 0 50%,var(--chk-b) 0 75%,transparent 0);
  background-size:28px 28px;
}
button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}

/* top bar */
.nav{display:flex;gap:6px;padding:8px;max-width:1100px;margin:0 auto}
.tile-btn{
  background:var(--tile);border:2px solid var(--tile-edge);border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:48px;padding:0 18px;font-size:1.15rem;
}
.tile-btn:hover,.tile-btn:focus-visible{border-color:var(--mint);outline:none}
.nav .side{flex:1 1 0}
.nav form.tile-btn{flex:3 1 0;cursor:text;padding:0 14px}
.nav input{
  all:unset;flex:1;min-width:0;text-align:center;font-size:1.15rem;
  text-transform:uppercase;letter-spacing:.04em;font-weight:700;font-family:var(--font);
}
.nav input::placeholder{color:var(--ink);opacity:.8}
.nav .go{all:unset;cursor:pointer;display:flex}
.nav .go:focus-visible{outline:2px solid var(--mint);border-radius:4px}
.nav svg{width:24px;height:24px}
.status{text-align:center;min-height:1.4em;margin:6px 0 0;font-size:.9rem}

/* icons */
.icon{
  position:relative;width:var(--s,84px);height:var(--s,84px);
  padding:0;border:0;background:none;display:block;
}
.icon img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.icon .on{opacity:0}
.icon:hover .on,.icon:focus-visible .on{opacity:1}
.icon:hover .off,.icon:focus-visible .off{opacity:0}
.icon:focus-visible{outline:none}
@keyframes wobble{
  0%,100%{transform:rotate(0) scale(1.06)}
  20%{transform:rotate(-7deg) scale(1.08)}
  40%{transform:rotate(6deg) scale(1.06)}
  60%{transform:rotate(-5deg) scale(1.08)}
  80%{transform:rotate(4deg) scale(1.06)}
}
.icon:hover,.icon:focus-visible{animation:wobble .55s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.icon:hover,.icon:focus-visible{animation:none}}

/* loading / home page */
.stage{--s:min(290px,44vw);--gap:-22px;position:relative;width:calc(var(--s)*2 + var(--gap));height:calc(var(--s)*2 + var(--gap));margin:34px auto 0}
.stage .icon{position:absolute}
.stage .p-cap{left:50%;top:0;margin-left:calc(var(--s) / -2)}
.stage .p-shirt{left:0;bottom:0}
.stage .p-pants{right:0;bottom:0}

/* results pages */
.cat{text-align:center;font-size:.95rem;margin:10px 0 4px}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;max-width:740px;margin:0 auto;padding:0 8px 40px}
.grid .icon{--s:min(140px,17vw)}

/* mute button */
.mute{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;width:52px;height:52px;padding:0;min-height:0}
.mute svg{width:26px;height:26px}
.mute .x{display:none}
.mute[aria-pressed="true"] .x{display:inline}
.mute[aria-pressed="true"] .wave{display:none}

/* pop ups */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.open{display:flex}
.card{background:var(--card);border-radius:16px;padding:28px 34px 22px;width:min(340px,100%);text-align:center}
.card h2{margin:0;font-size:1.55rem;line-height:1.25}
.card .price{margin:6px 0 0;font-size:1.55rem}
.choices{display:flex;justify-content:space-between;margin-top:22px;padding:0 6px}
.choices button{background:none;border:0;font-size:1.6rem;padding:6px 8px}
.yes{color:var(--yes)} .no{color:var(--no)}
.choices button:hover,.choices button:focus-visible{text-decoration:underline;outline:none}
</style>
</head>
<body class="is-home">

<nav class="nav" aria-label="Main">
  <button class="tile-btn side" id="home" type="button">Home</button>
  <form class="tile-btn" id="searchForm" role="search" autocomplete="off">
    <input id="q" type="text" placeholder="Search" aria-label="Search" enterkeyhint="search">
    <button class="go" type="submit" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/></svg>
    </button>
  </form>
  <button class="tile-btn side" id="donate" type="button">Donate</button>
</nav>
<p class="status" id="status" role="status"></p>

<main id="view"></main>

<button class="tile-btn mute" id="mute" type="button" aria-pressed="false" aria-label="Mute sound" title="Mute / unmute">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
    <path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
    <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
</button>

<div class="overlay" id="buyBox" role="dialog" aria-modal="true" aria-label="Confirm purchase">
  <div class="card">
    <h2>Are you sure you want to buy this item?</h2>
    <p class="price">$49.99</p>
    <div class="choices"><button class="yes" data-close>Yes</button><button class="no" data-close>No</button></div>
  </div>
</div>
<div class="overlay" id="donateBox" role="dialog" aria-modal="true" aria-label="Confirm donation">
  <div class="card">
    <h2>Are you sure you want to donate $10?</h2>
    <div class="choices"><button class="yes" data-close>Yes</button><button class="no" data-close>No</button></div>
  </div>
</div>

/* Categories and the words that lead to each one. Add more words freely. */
var CATS = {
  pants:  {label:"Pants",  img:"pants", words:["pants","pant","trousers","trouser","jeans","jean","denim","slacks","bottoms","bottom","leggings","legging","chinos","chino","joggers","jogger","sweatpants","cargo","cargos","shorts","short"]},
  shirts: {label:"Shirts", img:"shirt", words:["shirts","shirt","tee","tees","tshirt","tshirts","t","top","tops","blouse","blouses","polo","polos","jersey","jerseys","tank","tanktop","hoodie","hoodies","sweatshirt","sweater","sweaters"]},
  hats:   {label:"Hats",   img:"cap",   words:["hats","hat","cap","caps","beanie","beanies","snapback","snapbacks","headwear","fedora","fedoras","bucket","visor","visors","headgear"]}
};

var view = document.getElementById("view");
var statusEl = document.getElementById("status");
var qInput = document.getElementById("q");

function iconHTML(key, label, extra){
  return '<button type="button" class="icon ' + (extra||"") + '" aria-label="' + label + '">' +
    '<img class="off" alt="" src="' + IMG[key] + '">' +
    '<img class="on" alt="" src="' + IMG[key+"h"] + '"></button>';
}

function renderHome(){
  document.body.classList.add("is-home");
  view.innerHTML =
    '<div class="stage">' +
      iconHTML("cap","Browse hats","p-cap")  .replace('class="icon','data-go="hats" class="icon') +
      iconHTML("shirt","Browse shirts","p-shirt").replace('class="icon','data-go="shirts" class="icon') +
      iconHTML("pants","Browse pants","p-pants").replace('class="icon','data-go="pants" class="icon') +
    '</div>';
}

function renderCategory(name){
  var c = CATS[name];
  document.body.classList.remove("is-home");
  var html = '<h1 class="cat" style="font-size:.95rem;font-weight:700">' + c.label + '</h1><div class="grid">';
  for (var i = 0; i < 10; i++) html += iconHTML(c.img, c.label + " item " + (i+1), "item");
  view.innerHTML = html + "</div>";
}

function route(){
  var h = (location.hash || "").replace("#","");
  if (CATS[h]) renderCategory(h); else renderHome();
  window.scrollTo(0,0);
}

function go(hash){
  statusEl.textContent = "";
  if (("#" + hash) === location.hash || (!hash && !location.hash)) route();
  else location.hash = hash;
}

/* Map whatever was typed to a category */
function findCategory(text){
  var tokens = text.toLowerCase().replace(/[^a-z\s-]/g," ").replace(/-/g," ").split(/\s+/).filter(Boolean);
  var joined = tokens.join("");
  for (var name in CATS){
    var w = CATS[name].words;
    if (w.indexOf(joined) > -1) return name;
    for (var i = 0; i < tokens.length; i++) if (w.indexOf(tokens[i]) > -1) return name;
  }
  return null;
}

document.getElementById("searchForm").addEventListener("submit", function(e){
  e.preventDefault();
  var text = qInput.value.trim();
  if (!text) return;
  var hit = findCategory(text);
  if (hit){ qInput.value = ""; go(hit); }
  else statusEl.textContent = "No results for \u201C" + text + "\u201D. Try pants, shirts or hats.";
});
document.getElementById("searchForm").addEventListener("click", function(){ qInput.focus(); });

document.getElementById("home").addEventListener("click", function(){ qInput.value = ""; go(""); history.replaceState(null,"",location.pathname + location.search); route(); });
document.getElementById("donate").addEventListener("click", function(){ openBox("donateBox"); });

/* Clicks inside the page: loading-page icons open a category, shop items open the buy pop up */
view.addEventListener("click", function(e){
  var b = e.target.closest(".icon"); if (!b) return;
  if (b.dataset.go) go(b.dataset.go);
  else openBox("buyBox");
});

/* Pop ups */
var lastFocus = null;
function openBox(id){
  lastFocus = document.activeElement;
  var box = document.getElementById(id);
  box.classList.add("open");
  box.querySelector("button").focus();
}
function closeBoxes(){
  document.querySelectorAll(".overlay.open").forEach(function(o){ o.classList.remove("open"); });
  if (lastFocus) lastFocus.blur();
}
document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeBoxes); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeBoxes(); });

/* Sound: hover.mp3 on icon hover, background.mp3 looping quietly.
   Browsers block sound until the visitor clicks, taps or presses a key once. */
var hoverSound = new Audio("hover.mp3");
hoverSound.preload = "auto";
hoverSound.volume = 0.7;
var bgMusic = new Audio("background.mp3");
bgMusic.loop = true;
bgMusic.volume = 0.12;          /* change 0.12 (0 to 1) to make the background louder or quieter */
bgMusic.preload = "auto";

var bgStarted = false;
function startMusic(){
  if (bgStarted) return;
  var p = bgMusic.play();
  if (p && p.then) p.then(function(){ bgStarted = true; removeUnlock(); }).catch(function(){});
  else { bgStarted = true; removeUnlock(); }
}
var unlockEvents = ["pointerdown","keydown","touchstart"];
function removeUnlock(){ unlockEvents.forEach(function(t){ document.removeEventListener(t, startMusic); }); }
unlockEvents.forEach(function(t){ document.addEventListener(t, startMusic); });
startMusic();                    /* works if the browser allows autoplay */

document.addEventListener("mouseover", function(e){
  var icon = e.target.closest && e.target.closest(".icon");
  if (!icon || icon.contains(e.relatedTarget)) return;
  try { hoverSound.currentTime = 0; var p = hoverSound.play(); if (p && p.catch) p.catch(function(){}); } catch(err){}
});

/* Mute button: silences both the background music and the hover sound, and remembers the choice */
var muteBtn = document.getElementById("mute");
function setMuted(m){
  bgMusic.muted = m; hoverSound.muted = m;
  muteBtn.setAttribute("aria-pressed", m ? "true" : "false");
  muteBtn.setAttribute("aria-label", m ? "Unmute sound" : "Mute sound");
  try { localStorage.setItem("muted", m ? "1" : "0"); } catch(err){}
}
var savedMute = false;
try { savedMute = localStorage.getItem("muted") === "1"; } catch(err){}
setMuted(savedMute);
muteBtn.addEventListener("click", function(){ setMuted(muteBtn.getAttribute("aria-pressed") !== "true"); });

window.addEventListener("hashchange", route);
route();
</script>
